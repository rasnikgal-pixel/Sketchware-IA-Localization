name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/res/values-ru/**'
      - 'app/build.gradle'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=1 assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Sketchware-IA-ru-${{ github.sha }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sketchware-IA-ru-debug
          path: app/build/outputs/apk/debug/Sketchware-IA-ru-${{ github.sha }}.apk
          retention-days: 30
